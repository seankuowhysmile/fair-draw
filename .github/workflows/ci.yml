name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

      - run: pnpm --filter @fairdraw/app run check

      - run: pnpm -r build

      - uses: actions/upload-artifact@v4
        with:
          name: fairdraw-single-file
          path: packages/app/dist/index.html
